<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="WebSpider - Advanced Web Recon Tool">

  <!-- Background -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f14"></stop>
      <stop offset="50%" stop-color="#13202a"></stop>
      <stop offset="100%" stop-color="#1b3a2f"></stop>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="coloredBlur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"></rect>

  <!-- Web lines -->
  <g stroke="#1aff64" stroke-opacity="0.12">
    <line x1="150" y1="0" x2="150" y2="320"></line>
    <line x1="300" y1="0" x2="300" y2="320"></line>
    <line x1="450" y1="0" x2="450" y2="320"></line>
    <line x1="600" y1="0" x2="600" y2="320"></line>
    <line x1="750" y1="0" x2="750" y2="320"></line>
    <line x1="900" y1="0" x2="900" y2="320"></line>
    <line x1="1050" y1="0" x2="1050" y2="320"></line>

    <line x1="0" y1="260" x2="1200" y2="260"></line>
    <line x1="0" y1="220" x2="1200" y2="220"></line>
    <line x1="0" y1="180" x2="1200" y2="180"></line>
  </g>

  <!-- Spider logo -->
  <g transform="translate(170 160)" filter="url(#glow)">
    <!-- Body -->
    <circle cx="0" cy="0" r="16" fill="#1aff64"></circle>
    <circle cx="0" cy="-22" r="10" fill="#1aff64"></circle>

    <!-- Legs -->
    <g stroke="#1aff64" stroke-width="3" stroke-linecap="round">
      <path d="M -18 -10 C -45 -20, -55 -35, -70 -45"></path>
      <path d="M -20  -2 C -50   0, -65 -10, -85 -20"></path>
      <path d="M -20   8 C -50  15, -65  30, -80  45"></path>
      <path d="M -18  16 C -45  35, -55  50, -70  65"></path>

      <path d="M  18 -10 C  45 -20,  55 -35,  70 -45"></path>
      <path d="M  20  -2 C  50   0,  65 -10,  85 -20"></path>
      <path d="M  20   8 C  50  15,  65  30,  80  45"></path>
      <path d="M  18  16 C  45  35,  55  50,  70  65"></path>
    </g>
  </g>

  <!-- Title -->
  <text x="650" y="145" font-family="JetBrains Mono, Consolas, monospace" font-size="70" font-weight="700" fill="#1aff64" letter-spacing="6">
    WEBSPIDER
  </text>

  <!-- Subtitle -->
  <text x="650" y="190" font-family="JetBrains Mono, Consolas, monospace" font-size="22" fill="#c8facc" opacity="0.9">
    Advanced Web Recon &amp; Crawling Tool
  </text>

  <!-- Footer -->
  <text x="1180" y="300" text-anchor="end" font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#8affc1" opacity="0.6">
    Recon • Crawling • Pentest
  </text>

</svg>
